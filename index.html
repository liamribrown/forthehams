<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>For the Hams! 🐹✨ | UK Ethical Hamster Care Hub</title>
  <meta name="description" content="Authentic early 2000s web app for UK hamster welfare. Species-specific care, rescue-approved commercial food mixes, safe vs toxic food database, and ethical product directory. Working in conjunction with India's Hamster Rescue.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons & Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Noughties / 2000s Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-sky-200 selection:text-sky-950">

  <!-- 2000s Glossy Top App Bar -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-sky-200 shadow-xs">
    
    <!-- Top Partner Gloss Ribbon -->
    <div class="relative py-1 px-3 text-center text-white text-[11px] font-bold overflow-hidden shadow-xs" style="background: linear-gradient(180deg, #ff8c26 0%, #eb5500 50%, #d64700 51%, #eb5500 100%); border-bottom: 1px solid #b33900; text-shadow: 0 -1px 1px rgba(100,20,0,0.6);">
      <div class="absolute inset-x-0 top-0 h-[45%] bg-gradient-to-b from-white/40 to-transparent pointer-events-none"></div>
      <div class="relative flex items-center justify-center gap-1.5 tracking-tight">
        <span>🐾</span>
        <span>Working in conjunction with <strong>India's Hamster Rescue</strong> (Charity #1213919) ✨</span>
      </div>
    </div>

    <!-- App Navigation Header -->
    <div class="max-w-3xl mx-auto px-3.5 py-2 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2.5 group">
        <!-- Glossy Hamster Gel Bubble Icon -->
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-2xl gel-orange shadow-md">
          🐹
        </div>
        <div>
          <div class="text-lg font-black text-slate-900 tracking-tight leading-none font-heading flex items-center gap-1.5">
            <span>For the Hams!</span>
            <span class="text-[10px] font-black px-2 py-0.5 rounded-full gel-pink uppercase tracking-wider">UK</span>
          </div>
          <div class="text-[10px] font-bold text-sky-800 tracking-wide mt-0.5">
            100% Rescue Vetted • Zero Pet Shop Myths
          </div>
        </div>
      </a>

      <!-- Quick Action / India's Rescue Badge (Aqua Green Gel Pill) -->
      <a href="https://www.indiashamsterrescue.co.uk" target="_blank" rel="noopener noreferrer" class="gel-btn gel-green px-3 py-1 text-xs font-black shadow-xs flex items-center gap-1">
        <span>🌿</span>
        <span>India's Rescue ↗</span>
      </a>
    </div>

    <!-- Sticky Horizontal-Scroll Species Carousel -->
    <div class="border-t border-sky-100 bg-white/80 px-3 py-1.5" id="species-filter-container">
      <!-- Injected by app.js -->
    </div>
  </header>

  <!-- Species Metric Quick Banner (Dynamic) -->
  <div class="max-w-3xl mx-auto px-3 w-full" id="species-banner-area">
    <!-- Injected by app.js -->
  </div>

  <!-- Main Mobile App Viewport -->
  <main class="flex-grow max-w-3xl mx-auto px-3 sm:px-4 py-3 w-full pb-28">
    <div id="main-tab-content">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- 2000s Web 2.0 Bottom Sheet Modal -->
  <div id="bottom-sheet-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden transition-opacity">
    <div id="bottom-sheet-container" class="fixed inset-x-0 bottom-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 sm:max-w-lg w-full max-h-[88vh] bg-white border border-sky-300 rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-slide-up">
      <!-- Mobile Drag Handle -->
      <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto my-2.5 sm:hidden shrink-0"></div>
      
      <!-- Sheet Header (Metallic Gloss Bar) -->
      <div class="px-5 py-3 web2-header-bar flex items-center justify-between shrink-0">
        <h3 id="bottom-sheet-title" class="font-black text-base text-slate-900 font-heading">Details</h3>
        <button id="bottom-sheet-close" class="w-7 h-7 rounded-full gel-btn gel-silver flex items-center justify-center text-slate-700 font-black text-xs">
          ✕
        </button>
      </div>

      <!-- Sheet Scrollable Content -->
      <div id="bottom-sheet-body" class="p-5 overflow-y-auto overscroll-contain flex-grow bg-white">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Fixed Mobile Aqua Dock Navigation Bar -->
  <nav class="fixed bottom-0 inset-x-0 z-40 aqua-dock px-1 pt-1.5 pb-safe">
    <div class="max-w-md mx-auto flex items-center justify-around">
      
      <!-- 1. Care Guides -->
      <button data-nav-tab="guides" class="flex flex-col items-center justify-center flex-1 py-1 text-center select-none group">
        <div class="w-9 h-9 rounded-2xl flex items-center justify-center transition-all tab-icon-bg">
          <i data-lucide="book-open" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight tab-label">Guides</span>
      </button>

      <!-- 2. Food Hub -->
      <button data-nav-tab="food" class="flex flex-col items-center justify-center flex-1 py-1 text-center select-none group">
        <div class="w-9 h-9 rounded-2xl flex items-center justify-center transition-all tab-icon-bg">
          <i data-lucide="apple" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight tab-label">Food Hub</span>
      </button>

      <!-- 3. Ethical Shop -->
      <button data-nav-tab="shop" class="flex flex-col items-center justify-center flex-1 py-1 text-center select-none group">
        <div class="w-9 h-9 rounded-2xl flex items-center justify-center transition-all tab-icon-bg">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight tab-label">Shop</span>
      </button>

      <!-- 4. Adoption Ready Checklist -->
      <button data-nav-tab="checklist" class="flex flex-col items-center justify-center flex-1 py-1 text-center select-none group">
        <div class="w-9 h-9 rounded-2xl flex items-center justify-center transition-all tab-icon-bg">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight tab-label">Checklist</span>
      </button>

      <!-- 5. Rescue Directory -->
      <button data-nav-tab="rescues" class="flex flex-col items-center justify-center flex-1 py-1 text-center select-none group">
        <div class="w-9 h-9 rounded-2xl flex items-center justify-center transition-all tab-icon-bg">
          <i data-lucide="heart" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-bold mt-0.5 tracking-tight tab-label">Rescues</span>
      </button>

    </div>
  </nav>

  <!-- App Entry Script -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
