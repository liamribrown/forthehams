<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>For the Hams! | UK Ethical Hamster Care & Rescue Standards</title>
  <meta name="description" content="Mobile-friendly UK hamster welfare guide, species-specific care, rescue-approved commercial food mixes, safe vs toxic food lookup, and ethical product directory. Working with India's Hamster Rescue.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            stone: {
              50: '#fafaf9',
              100: '#f5f5f4',
              200: '#e7e5e4',
              300: '#d6d3d1',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
            },
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Mobile App Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#faf8f5] text-stone-800 antialiased min-h-screen flex flex-col justify-between selection:bg-amber-100 selection:text-amber-900">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-40 bg-[#faf8f5]/95 backdrop-blur-md border-b border-stone-200/80">
    <!-- Top Partner Micro-Banner -->
    <div class="bg-gradient-to-r from-amber-700 via-stone-800 to-amber-900 text-amber-100 text-[11px] font-medium py-1 px-3 text-center flex items-center justify-center gap-1.5 overflow-hidden text-ellipsis whitespace-nowrap">
      <span>🐹</span>
      <span>Working in conjunction with <strong>India's Hamster Rescue</strong> (Charity #1213919)</span>
    </div>

    <!-- App Navigation Header -->
    <div class="max-w-3xl mx-auto px-3.5 py-2.5 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-600 flex items-center justify-center text-xl shadow-xs group-active:scale-95 transition-transform">
          🐹
        </div>
        <div>
          <div class="text-base font-black text-stone-900 tracking-tight leading-none font-heading flex items-center gap-1">
            <span>For the Hams!</span>
          </div>
          <div class="text-[10px] font-medium text-stone-500 tracking-wide mt-0.5">
            UK Ethical Rescue Care
          </div>
        </div>
      </a>

      <!-- Quick Action / India's Rescue Badge -->
      <a href="https://www.indiashamsterrescue.co.uk" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-200/80 text-amber-900 text-[11px] font-semibold hover:bg-amber-100 transition-colors">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Rescue Partner</span>
      </a>
    </div>

    <!-- Sticky Horizontal-Scroll Species Bar -->
    <div class="border-t border-stone-200/60 bg-white/70 px-3 py-2" id="species-filter-container">
      <!-- Injected by app.js -->
    </div>
  </header>

  <!-- Species Metric Quick Banner (Collapsible/Dynamic) -->
  <div class="max-w-3xl mx-auto px-3 w-full" id="species-banner-area">
    <!-- Injected by app.js -->
  </div>

  <!-- Main Mobile App Viewport -->
  <main class="flex-grow max-w-3xl mx-auto px-3 sm:px-4 py-3 w-full pb-28">
    <div id="main-tab-content">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Mobile Bottom Sheet Modal (Slides up from screen bottom) -->
  <div id="bottom-sheet-backdrop" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 hidden transition-opacity">
    <div id="bottom-sheet-container" class="fixed inset-x-0 bottom-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 sm:max-w-lg w-full max-h-[85vh] bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-slide-up">
      <!-- Mobile Drag Handle -->
      <div class="w-10 h-1 bg-stone-300 rounded-full mx-auto my-2.5 sm:hidden shrink-0"></div>
      
      <!-- Sheet Header -->
      <div class="px-5 py-3 border-b border-stone-100 flex items-center justify-between shrink-0">
        <h3 id="bottom-sheet-title" class="font-bold text-base text-stone-900">Details</h3>
        <button id="bottom-sheet-close" class="p-1.5 rounded-full hover:bg-stone-100 text-stone-400 hover:text-stone-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Sheet Scrollable Content -->
      <div id="bottom-sheet-body" class="p-5 overflow-y-auto overscroll-contain flex-grow">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Fixed Mobile Bottom Navigation Bar (iOS / Android Style) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#faf8f5]/95 backdrop-blur-md border-t border-stone-200/90 shadow-[0_-4px_20px_rgba(0,0,0,0.04)] px-1 pt-1.5 pb-safe">
    <div class="max-w-md mx-auto flex items-center justify-around">
      
      <!-- 1. Care Guides -->
      <button data-nav-tab="guides" class="flex flex-col items-center justify-center flex-1 py-1 text-center transition-all">
        <div class="w-8 h-8 rounded-full flex items-center justify-center transition-colors tab-icon-bg">
          <i data-lucide="book-open" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-semibold mt-0.5 tracking-tight tab-label">Guides</span>
      </button>

      <!-- 2. Food Hub -->
      <button data-nav-tab="food" class="flex flex-col items-center justify-center flex-1 py-1 text-center transition-all">
        <div class="w-8 h-8 rounded-full flex items-center justify-center transition-colors tab-icon-bg">
          <i data-lucide="apple" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-semibold mt-0.5 tracking-tight tab-label">Food Hub</span>
      </button>

      <!-- 3. Ethical Shop -->
      <button data-nav-tab="shop" class="flex flex-col items-center justify-center flex-1 py-1 text-center transition-all">
        <div class="w-8 h-8 rounded-full flex items-center justify-center transition-colors tab-icon-bg">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-semibold mt-0.5 tracking-tight tab-label">Shop</span>
      </button>

      <!-- 4. Adoption Ready Checklist -->
      <button data-nav-tab="checklist" class="flex flex-col items-center justify-center flex-1 py-1 text-center transition-all">
        <div class="w-8 h-8 rounded-full flex items-center justify-center transition-colors tab-icon-bg">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-semibold mt-0.5 tracking-tight tab-label">Checklist</span>
      </button>

      <!-- 5. Rescue Directory -->
      <button data-nav-tab="rescues" class="flex flex-col items-center justify-center flex-1 py-1 text-center transition-all">
        <div class="w-8 h-8 rounded-full flex items-center justify-center transition-colors tab-icon-bg">
          <i data-lucide="heart" class="w-4 h-4"></i>
        </div>
        <span class="text-[10px] font-semibold mt-0.5 tracking-tight tab-label">Rescues</span>
      </button>

    </div>
  </nav>

  <!-- App Entry Script -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
