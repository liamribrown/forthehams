              "@type": "Answer",
              "text": "The strict UK rescue welfare standard for all hamster species (Syrian, Dwarf, and Roborovski) is an unbroken floor space of at least 100cm length by 50cm width by 50cm height (minimum 5,000 square centimetres or approximately 775 square inches). Connected modular cages or barred cages with tall drop hazards do not meet this standard."

              "text": "Syrian hamsters require a solid running wheel with an upright diameter of at least 28cm to 32cm (11 to 12.5 inches). Wheels smaller than 28cm force Syrian hamsters to run with arched backs, which causes severe chronic spinal deformation, nerve compression, and arthritis. Wire mesh or rungs must never be used as they cause bumblefoot and limb fractures."
