<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Card Preview & Validator — For the Hams!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Caveat:wght@700&family=Silkscreen:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/cards.css?v=3.2">
  <style>
    body {
      background: #eadeca;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      margin: 0;
      padding: 30px;
      color: #22180f;
    }
    .header {
      background: #fffdf8;
      border: 3px solid #22180f;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 30px;
      box-shadow: 6px 6px 0 #22180f;
    }
    .validator-box {
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
    }
    .validator-pass {
      background: #d7f5e3;
      border: 2px solid #22180f;
      color: #115522;
    }
    .validator-fail {
      background: #ffdcd6;
      border: 2px solid #22180f;
      color: #881111;
    }
    .preview-section {
      margin-bottom: 50px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 32px;
    }
    .preview-card-wrap {
      background: #fffdf8;
      border: 3px solid #22180f;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 6px 6px 0 #22180f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-scale-feed {
      transform: scale(0.35);
      transform-origin: top center;
      width: 1080px;
      height: 1350px;
      margin-bottom: -870px;
    }
    .preview-scale-story {
      transform: scale(0.25);
      transform-origin: top center;
      width: 1080px;
      height: 1920px;
      margin-bottom: -1420px;
    }
    .card-meta {
      width: 100%;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 2px dashed #22180f;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="font-family:'Bricolage Grotesque',sans-serif;margin:0 0 8px 0;font-size:32px">
      Trading Card Preview & Content Validator
    </h1>
    <p style="margin:0;font-size:16px;color:#554433">
      Series 1: Ham Basics • Testing cards across Instagram Feed (4:5) and Story (9:16) layouts.
    </p>
    <div id="validator-results" class="validator-box validator-pass">
      Running automated content verification...
    </div>
  </div>

  <div class="preview-section">
    <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-size:24px;margin-bottom:16px">
      1. Instagram Feed Posts (1080 × 1350, 4:5)
    </h2>
    <div id="feed-grid" class="preview-grid"></div>
  </div>

  <div class="preview-section">
    <h2 style="font-family:'Bricolage Grotesque',sans-serif;font-size:24px;margin-bottom:16px">
      2. Instagram Stories (1080 × 1920, 9:16)
    </h2>
    <div id="story-grid" class="preview-grid"></div>
  </div>

  <script type="module">
    import { cards, series, formatCardNo } from './assets/js/data/cards.js?v=3.2';
    import { buildExport } from './assets/js/cards/card-template.js?v=3.2';

    const feedGrid = document.getElementById('feed-grid');
    const storyGrid = document.getElementById('story-grid');
    const validatorEl = document.getElementById('validator-results');

    const issues = [];

    // Content Validator
    cards.forEach(c => {
      // 1. Check title length
      if (c.name.split(' ').length > 3) {
        issues.push(`Card ${formatCardNo(c.no)} title "${c.name}" exceeds 3 words.`);
      }
      // 2. Check no finite numbers "/14", "of 14", "all 14"
      const strRep = JSON.stringify(c);
      if (/(\/14|of 14|all 14)/i.test(strRep)) {
        issues.push(`Card ${formatCardNo(c.no)} contains forbidden finite total (14).`);
      }
      // 3. Check NO HAY rule
      if (c.yes && c.yes.some(y => /hay/i.test(y))) {
        issues.push(`CRITICAL: Card ${formatCardNo(c.no)} lists HAY in YES list!`);
      }
      // 4. Check CARE LV is 1, 2, or 3
      if (![1, 2, 3].includes(c.careLv)) {
        issues.push(`Card ${formatCardNo(c.no)} has invalid CARE LV ${c.careLv}.`);
      }
    });

    if (issues.length === 0) {
      validatorEl.className = 'validator-box validator-pass';
      validatorEl.innerHTML = `✓ <strong>VALIDATION PASSED</strong>: 14 cards verified. All word counts respected, open-ended numbers confirmed, NO HAY in acceptable lists, CARE LV badges 1–3 intact.`;
    } else {
      validatorEl.className = 'validator-box validator-fail';
      validatorEl.innerHTML = `<strong>VALIDATION WARNINGS:</strong><br>${issues.join('<br>')}`;
    }

    // Render Feeds
    cards.forEach(c => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-card-wrap';

      const scaleBox = document.createElement('div');
      scaleBox.className = 'preview-scale-feed';
      scaleBox.appendChild(buildExport(c, 'feed'));

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      meta.innerHTML = `<span>${formatCardNo(c.no)} • ${c.name}</span><span>FEED (4:5)</span>`;

      wrap.appendChild(scaleBox);
      wrap.appendChild(meta);
      feedGrid.appendChild(wrap);
    });

    // Render Stories
    cards.forEach(c => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-card-wrap';

      const scaleBox = document.createElement('div');
      scaleBox.className = 'preview-scale-story';
      scaleBox.appendChild(buildExport(c, 'story'));

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      meta.innerHTML = `<span>${formatCardNo(c.no)} • ${c.name}</span><span>STORY (9:16)</span>`;

      wrap.appendChild(scaleBox);
      wrap.appendChild(meta);
      storyGrid.appendChild(wrap);
    });
  </script>
</body>
</html>
